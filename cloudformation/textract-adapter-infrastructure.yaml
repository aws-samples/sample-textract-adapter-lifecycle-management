AWSTemplateFormatVersion: "2010-09-09"
Description: Supporting infrastructure for Amazon Textract adapter workloads

Parameters:
  SourceBucketName:
    Type: String
    Description: Name of the S3 bucket for input documents
    Default: amzn-s3-demo-source-bucket
  OutputBucketName:
    Type: String
    Description: Name of the S3 bucket for Textract output
    Default: amzn-s3-demo-destination-bucket
  LoggingBucketName:
    Type: String
    Description: Name of the S3 bucket for access logging
    Default: amzn-s3-demo-logging-bucket

Resources:
  TextractProcessingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: textract-adapter-processing-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TextractAdapterAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Amazon Textract does not support resource-level permissions for
              # AnalyzeDocument, StartDocumentAnalysis, or GetDocumentAnalysis.
              # Resource must be "*". See:
              # https://docs.aws.amazon.com/textract/latest/dg/security_iam_service-with-iam.html
              - Sid: TextractAnalysis
                Effect: Allow
                Action:
                  - textract:AnalyzeDocument
                  - textract:StartDocumentAnalysis
                  - textract:GetDocumentAnalysis
                Resource: "*"
              - Sid: ReadSourceDocuments
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${SourceBucketName}/*"
              - Sid: WriteOutputResults
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${OutputBucketName}/*"
              - Sid: ReadAdapterParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/textract/adapters/*"
              - Sid: DecryptSourceDocuments
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !GetAtt SourceKMSKey.Arn
              - Sid: EncryptOutputResults
                Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt OutputKMSKey.Arn

  SourceKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for encrypting source documents
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowTextractRoleDecrypt
            Effect: Allow
            Principal:
              AWS: !GetAtt TextractProcessingRole.Arn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: "*"

  OutputKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for encrypting Textract output
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: AllowTextractRoleEncrypt
            Effect: Allow
            Principal:
              AWS: !GetAtt TextractProcessingRole.Arn
            Action:
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource: "*"

  # S3 access logging bucket
  LoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref LoggingBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Logging bucket logs to itself with a distinct prefix
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucketName
        LogFilePrefix: self-logs/

  LoggingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LoggingBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: S3ServerAccessLogsPolicy
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "arn:aws:s3:::${LoggingBucketName}/*"
            Condition:
              ArnLike:
                aws:SourceArn:
                  - !Sub "arn:aws:s3:::${SourceBucketName}"
                  - !Sub "arn:aws:s3:::${OutputBucketName}"
                  - !Sub "arn:aws:s3:::${LoggingBucketName}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${LoggingBucketName}"
              - !Sub "arn:aws:s3:::${LoggingBucketName}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  DocumentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SourceBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref SourceKMSKey
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: source-bucket-logs/

  DocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${SourceBucketName}"
              - !Sub "arn:aws:s3:::${SourceBucketName}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref OutputBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref OutputKMSKey
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: output-bucket-logs/

  OutputBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OutputBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${OutputBucketName}"
              - !Sub "arn:aws:s3:::${OutputBucketName}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  ProcessingRoleArn:
    Description: ARN of the Textract processing IAM role
    Value: !GetAtt TextractProcessingRole.Arn
  SourceBucketArn:
    Description: ARN of the source document bucket
    Value: !GetAtt DocumentBucket.Arn
  OutputBucketArn:
    Description: ARN of the output bucket
    Value: !GetAtt OutputBucket.Arn
