AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Supporting infrastructure for Amazon Textract adapter workloads.
  Provisions an IAM role, S3 buckets, and SSM parameter namespace
  for the adapter lifecycle management pattern.

Resources:
  # --- IAM Role for Lambda-based Textract processing ---
  TextractProcessingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TextractAdapterAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Amazon Textract AnalyzeDocument, StartDocumentAnalysis, and
              # GetDocumentAnalysis do not support resource-level permissions.
              # These actions require Resource: "*" — this is an AWS service
              # limitation, not a least-privilege gap. Least privilege is enforced
              # by scoping S3 and SSM access to specific resources below.
              # Reference: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazontextract.html
              - Sid: TextractAnalysis
                Effect: Allow
                Action:
                  - textract:AnalyzeDocument
                  - textract:StartDocumentAnalysis
                  - textract:GetDocumentAnalysis
                Resource: "*"
              - Sid: S3ReadSource
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "${DocumentBucket.Arn}/*"
              - Sid: S3WriteOutput
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${OutputBucket.Arn}/*"
              - Sid: SSMReadParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/textract/adapters/*"

  # --- Source Document Bucket ---
  # For production workloads, consider enabling AWS KMS server-side encryption.
  # See: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html
  DocumentBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DocumentBucket.Arn
              - !Sub "${DocumentBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # --- Output Bucket ---
  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OutputBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref OutputBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt OutputBucket.Arn
              - !Sub "${OutputBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  ProcessingRoleArn:
    Description: ARN of the Textract processing IAM role
    Value: !GetAtt TextractProcessingRole.Arn

  DocumentBucketName:
    Description: Name of the source document bucket
    Value: !Ref DocumentBucket

  OutputBucketName:
    Description: Name of the output bucket
    Value: !Ref OutputBucket
